<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini AI Chat</title>
    <meta name="description" content="A Gemini-powered chat application with conversation history and sentiment visualizations, connected to a Spring Boot WebSocket backend." />
    <meta name="author" content="TheBenzzCreations" />
    <meta name="creator" content="TheBenzzCreations" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gemini AI Chat" />
    <meta property="og:title" content="Gemini AI Chat" />
    <meta property="og:description" content="A Gemini-powered chat application with conversation history and sentiment visualizations, connected to a Spring Boot WebSocket backend." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Gemini AI Chat" />
    <meta name="twitter:description" content="A Gemini-powered chat application with conversation history and sentiment visualizations, connected to a Spring Boot WebSocket backend." />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Gemini AI Chat",
        "applicationCategory": "CommunicationApplication",
        "creator": {
          "@type": "Organization",
          "name": "TheBenzzCreations",
          "url": "https://www.thebenzzcreations.com/"
        }
      }
    </script>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script defer src="script.js"></script>
  </head>
  <body>
    <div class="sidebar">
      <h2>Gemini</h2>
      <button class="new-chat" onclick="startNewChat()">+ New Chat</button>
      <ul class="chat-history" id="chat-history"></ul>
    </div>
    <div class="chat-container">
      <div class="chat-header">
        Hello, <span class="username">Dusky</span>
      </div>
      <div class="chat-box" id="chat-box"></div>
      <div class="chat-input">
        <button class="mic-btn">🎤</button>
        <input
          type="text"
          id="user-input"
          placeholder="Ask Gemini..."
          onkeypress="handleKeyPress(event)"
        />
        <button id="send-btn" onclick="sendMessage()">➤</button>
      </div>
      <footer class="developer-credit">
        <a
          href="https://www.thebenzzcreations.com/"
          title="TheBenzzCreations"
        >Developed by TheBenzzCreations</a>
      </footer>
    </div>
  </body>
</html>
